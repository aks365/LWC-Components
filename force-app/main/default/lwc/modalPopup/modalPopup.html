<template>
    <lightning-card title="Modal Popup Example">
        <div class="slds-p-around_medium">
            <lightning-button
                label="Open Modal"
                variant="brand"
                onclick={openModal}>
            </lightning-button>
        </div>
    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog"
                 tabindex="-1"
                 aria-modal="true"
                 class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        My Custom Modal
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p>Welcome to my custom LWC modal popup!</p>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

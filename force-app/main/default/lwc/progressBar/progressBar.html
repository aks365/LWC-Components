<template>
    <lightning-card title="Custom Progress Bar">
        <div class="container">

            <div class="progress-info">
                <span>Task Completion</span>
                <span>{progress}%</span>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                aria-label="Task Completion"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow={progress}>

                <div class="progress-fill"
                    style={progressStyle}>
                </div>
            </div>

            <p class="status-text">
                {statusMessage}
            </p>

            <div class="button-container">
                <lightning-button
                    label="Increase Progress"
                    variant="brand"
                    onclick={increaseProgress}
                    disabled={isComplete}>
                </lightning-button>

                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={resetProgress}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
